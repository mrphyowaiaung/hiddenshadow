<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11100e">
  <title>HIDDEN SHADOW | Contact</title>
  <style>
    :root { color-scheme: dark; --gold:#d6b46a; --ink:#11100e; --panel:#1b1915; --muted:#c9c0ad; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      background: radial-gradient(ellipse at top, #332a18 0%, #171512 42%, #0c0c0b 100%);
      color:#f8f4e9; font-family: Arial, Helvetica, sans-serif;
    }
    main { width:min(100%, 420px); text-align:center; }
    .logo { display:block; width:190px; height:190px; object-fit:cover; object-position:center; border-radius:50%; border:2px solid var(--gold); box-shadow:0 0 22px rgba(214,180,106,.22); margin:0 auto 22px; }
    h1 { margin:0; font-size:clamp(27px, 7vw, 36px); letter-spacing:4px; font-weight:700; }
    .tagline { color:var(--muted); margin:12px 0 32px; letter-spacing:2px; font-size:11px; text-transform:uppercase; }
    .actions { display:grid; gap:14px; }
    a { display:flex; align-items:center; justify-content:center; gap:12px; min-height:58px; border-radius:10px;
      text-decoration:none; font-weight:700; letter-spacing:1.6px; transition:transform .15s ease, background .15s ease; }
    a:hover { transform:translateY(-2px); }
    .call { background:var(--gold); color:#17130a; }
    .email { border:1px solid var(--gold); color:var(--gold); background:rgba(20,18,14,.55); }
    .hint { margin-top:28px; color:#918875; font-size:11px; line-height:1.6; }
    footer { margin-top:36px; color:#766e5e; font-size:10px; letter-spacing:2px; }
    svg { width:20px; height:20px; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="HIDDEN SHADOW logo">
    <h1>HIDDEN SHADOW</h1>
    <p class="tagline">Connect with us</p>
    <div class="actions">
      <a class="call" href="tel:+959969310001">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.2-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.8 2.1Z"/></svg>
        CALL US
      </a>
      <!-- Replace hiddenshadowpro@gmail.com with the real contact email before publishing. -->
      <a class="email" href="mailto:hiddenshadowpro@gmail.com?subject=Contact%20HIDDEN%20SHADOW">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        CONTACT US
      </a>
    </div>
    <p class="hint">Tap a button above to contact HIDDEN SHADOW.</p>
    <footer>HIDDEN SHADOW · OFFICIAL CONTACT</footer>
  </main>
</body>
</html>
